version: '3.7'
services:
  webapi:
    container_name: dotnetspa-webapi
    restart: always
    build:
      context: .
      dockerfile: DotnetSpa.WebApi/Dockerfile
    image: dotnetspa/webapi
    networks:
      dotnetspa:
        ipv4_address: 172.42.2.1
    ports:
      - '5000:8080'
      - '5001:443'
  angularclient:
    container_name: dotnetspa-angularclient
    restart: always
    depends_on:
      - webapi
    build:
      context: .
      dockerfile: DotnetSpa.AngularClient/Dockerfile
    image: dotnetspa/angularclient
    networks:
      dotnetspa:
        ipv4_address: 172.42.1.2
    ports:
      - '4200:4200'
  vue3client:
    container_name: dotnetspa-vue3client
    restart: always
    depends_on:
      - webapi
    build:
      context: .
      dockerfile: DotnetSpa.Vue3Client/Dockerfile
    image: dotnetspa/vue3client
    networks:
      dotnetspa:
        ipv4_address: 172.42.1.3
    ports:
      - '8080:8081'
networks:
  dotnetspa:
    name: dotnetspa
    driver: bridge
    ipam:
      config:
        - subnet: 172.42.0.0/16
